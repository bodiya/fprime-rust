[package]
name = "fprime-comp"
description = "F Prime Rust port: object/port/component model and cmd/evt/tlm glue (autocoder-contract equivalent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Hosted build (std::sync locks, std::thread tasks, the full fprime-os).
std = ["fprime-fw/std", "fprime-os/std"]
# `no_std` + `alloc` build (ROADMAP item 13): spin locks, and the fprime-os
# subset whose tasks / clock / blocking waits a platform supplies. Build
# with `--no-default-features --features spin`.
spin = ["fprime-fw/spin", "fprime-os/spin"]

[dependencies]
fprime-config.workspace = true
fprime-fw = { path = "../fprime-fw", default-features = false }
fprime-os = { path = "../fprime-os", default-features = false }

# A `#![no_std]` component crate built as a library: proves the exported
# macros expand without the std prelude (ROADMAP item 13).
[[example]]
name = "no_std_component"
crate-type = ["lib"]
