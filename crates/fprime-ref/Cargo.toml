[package]
name = "fprime-ref"
description = "F Prime Rust port: reference deployment binary (Ref-style topology, GDS-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fprime-config.workspace = true
fprime-fw.workspace = true
fprime-os.workspace = true
fprime-utils.workspace = true
fprime-comp.workspace = true
fprime-svc.workspace = true
fprime-drv.workspace = true

[features]
# Instantiate upstream Ref's `wasmSeq` (Svc::WasmSequencer, base id
# 0x10007000). Off by default: it pulls in the `spacewasm` crate through
# `fprime-svc/wasm`, and the checked-in dictionary describes the default
# build.
wasm = ["fprime-svc/wasm"]

[[bin]]
name = "fprime-ref"
path = "src/main.rs"

[dev-dependencies]
# The JSON parser the dictionary back end uses (tests/upstream_ids.rs).
fprime-fpp.workspace = true
