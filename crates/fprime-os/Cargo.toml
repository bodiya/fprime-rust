[package]
name = "fprime-os"
description = "F Prime Rust port: OS abstraction layer - task, mutex, priority queue, file, filesystem, console, rawtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Hosted OSAL: every facility, over std (threads, files, SystemTime).
std = ["fprime-fw/std"]
# `no_std` + `alloc` subset (ROADMAP item 13): queue, task, raw time,
# interval timer, stub cpu/memory, over the `platform` seam. Build with
# `--no-default-features --features spin`.
spin = ["fprime-fw/spin"]
# Make `Os::Generic::LocklessPriorityQueue` the `Os::Queue` delegate (the
# equivalent of linking upstream's DefaultLocklessPriorityQueue.cpp instead
# of DefaultPriorityQueue.cpp): ISR-safe non-blocking send/receive.
# Recommended for no_std deployments that send to queues from interrupts.
lockless-queue = []

[dependencies]
fprime-config.workspace = true
fprime-fw = { path = "../fprime-fw", default-features = false }
